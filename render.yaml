# Render.com blueprint for Bilal's World (the app lives in ./bilals-world).
# Render → New → Blueprint → choose this repository and this branch.
services:
  - type: web
    name: bilals-world
    runtime: docker
    branch: claude/video-animations-text-eq4m3r
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: bilals-world
    plan: starter            # a paid plan is required for the persistent disk
    healthCheckPath: /api/meta
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # you type it in the dashboard; never commit it
      - key: PUBLIC_URL
        sync: false          # e.g. https://bilals-world.onrender.com (used in password-reset links)
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
