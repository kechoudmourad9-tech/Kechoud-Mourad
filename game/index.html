<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>بن طارق مايحفريش</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0d0820; --pink: #ff4fa3; --blue: #3d8bff; --yellow: #ffd23f; --text: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; touch-action: none; font-family: "Cairo", system-ui, sans-serif; color: var(--text); }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; height: 100%; max-width: 560px; display: block; background: #000; }
  .hud { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
  .pill { background: rgba(13,8,32,.75); border: 3px solid #fff; border-radius: 999px; padding: 2px 16px 4px; font-weight: 900; font-size: 20px; }
  .pill b { color: var(--yellow); }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 16px; background: radial-gradient(circle at 50% 30%, rgba(255,79,163,.35), rgba(13,8,32,.92) 60%); }
  .screen.hidden { display: none; }
  h1 { font-family: "Lalezar", "Cairo", sans-serif; font-size: clamp(40px, 11vw, 64px); line-height: 1.2; color: #fff;
    text-shadow: 0 6px 0 var(--pink), 0 0 30px rgba(255,79,163,.7); direction: rtl; }
  .sub { font-size: 18px; opacity: .9; max-width: 360px; direction: rtl; }
  button { font-family: "Lalezar", "Cairo", sans-serif; font-size: 30px; padding: 6px 34px 12px; border-radius: 22px; border: 4px solid #fff;
    background: var(--pink); color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.35); cursor: pointer; }
  button:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .keys { font-size: 14px; opacity: .75; direction: ltr; }
  #hero { width: 150px; height: 150px; background: transparent; max-width: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="hud" id="hud" style="display:none">
  <div class="pill">النقاط <b id="score">0</b></div>
  <div class="pill">🪙 <b id="coins">0</b></div>
</div>

<div class="screen" id="start">
  <canvas id="hero" width="300" height="300"></canvas>
  <h1>بن طارق مايحفريش</h1>
  <p class="sub">بن طارق هارب من الدراسة! اجرِ، اجمع القطع، وتفادى الحواجز والقطارات.</p>
  <button id="play">ابدأ</button>
  <p class="keys">← → change de voie · ↑ sauter · ↓ glisser — ou swipe sur mobile</p>
</div>

<div class="screen hidden" id="over">
  <h1>!خسرت</h1>
  <p class="sub" id="final"></p>
  <button id="again">عاود</button>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- storage (best score) ---------- */
  const store = {
    get() { try { return +(localStorage.getItem("bt-best") || 0); } catch { return 0; } },
    set(v) { try { localStorage.setItem("bt-best", String(v)); } catch {} },
  };

  /* ---------- sound (tiny WebAudio synth) ---------- */
  let ac = null;
  function beep(f, d = 0.08, type = "square", vol = 0.06, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
      v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d);
    } catch {}
  }
  const sfx = {
    coin: () => { beep(988, 0.06, "square", 0.05); setTimeout(() => beep(1319, 0.08, "square", 0.05), 50); },
    jump: () => beep(300, 0.18, "triangle", 0.08, 400),
    slide: () => beep(220, 0.15, "sawtooth", 0.04, -120),
    lane: () => beep(520, 0.04, "sine", 0.05),
    crash: () => { beep(160, 0.4, "sawtooth", 0.1, -120); beep(90, 0.5, "square", 0.08, -50); },
  };

  /* ---------- world / projection ---------- */
  const LANE = 2.4;           // world units between lanes
  const FAR = 70;             // draw distance
  const CAM_D = 7;            // projection constant
  function proj(x, y, z) {    // world -> screen
    const s = CAM_D / (CAM_D + z);
    const horizon = H * 0.3, ground = H * 0.98;
    return { x: W / 2 + x * s * (W * 0.16), y: horizon + (ground - horizon) * s - y * s * (W * 0.16), s };
  }

  /* ---------- state ---------- */
  let st, best = store.get();
  function reset() {
    st = {
      on: true, t: 0, speed: 16, dist: 0, coins: 0,
      lane: 0, px: 0, y: 0, vy: 0, slide: 0, run: 0,
      obs: [], spawnZ: 30, shake: 0, flash: 0, parts: [],
    };
  }
  reset(); st.on = false;

  // obstacle kinds: barrier (jump over), bar (slide under), train (change lane), coin
  function spawnRow(z) {
    const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
    const free = lanes[0];                       // always leave one lane passable
    const n = Math.random() < 0.55 ? 1 : 2;
    for (let i = 1; i <= n; i++) {
      const r = Math.random();
      const kind = r < 0.38 ? "barrier" : r < 0.66 ? "bar" : "train";
      st.obs.push({ kind, lane: lanes[i], z, len: kind === "train" ? 9 + Math.random() * 8 : 0.6, hit: false });
    }
    const cz = z + (Math.random() < 0.5 ? 0 : 3);
    for (let k = 0; k < 6; k++) st.obs.push({ kind: "coin", lane: free, z: cz + k * 1.6, y: 0.9, hit: false });
  }

  /* ---------- input ---------- */
  function act(a) {
    if (!st.on) return;
    if (a === "left" && st.lane > -1) { st.lane--; sfx.lane(); }
    if (a === "right" && st.lane < 1) { st.lane++; sfx.lane(); }
    if (a === "up" && st.y === 0) { st.vy = 11.5; st.slide = 0; sfx.jump(); }
    if (a === "down") { if (st.y > 0) st.vy = -18; st.slide = 0.75; sfx.slide(); }
  }
  addEventListener("keydown", (e) => {
    const m = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down", " ": "up" }[e.key];
    if (m) { e.preventDefault(); act(m); }
  });
  let ts = null;
  addEventListener("touchstart", (e) => { const t = e.touches[0]; ts = [t.clientX, t.clientY]; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (!ts) return;
    const t = e.changedTouches[0], dx = t.clientX - ts[0], dy = t.clientY - ts[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) act(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
    ts = null;
  });

  /* ---------- drawing helpers ---------- */
  function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

  function drawScene() {
    // sky
    const sky = g.createLinearGradient(0, 0, 0, H * 0.32);
    sky.addColorStop(0, "#2a1260"); sky.addColorStop(0.6, "#c2477e"); sky.addColorStop(1, "#ffa45a");
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    // sun
    g.fillStyle = "#ffe08a"; g.beginPath(); g.arc(W * 0.5, H * 0.3, W * 0.13, Math.PI, 0); g.fill();
    // far skyline (parallax with distance travelled)
    g.fillStyle = "#3a1f6b";
    for (let i = -1; i < 12; i++) {
      const bw = W * 0.11, x = ((i * bw * 1.1 - st.dist * 0.4) % (W * 1.3)) - W * 0.1;
      const bh = H * (0.05 + ((i * 37) % 7) / 60);
      g.fillRect(x, H * 0.3 - bh, bw, bh);
    }
    // ground
    g.fillStyle = "#2b2350"; g.fillRect(0, H * 0.3, W, H);
    // track bed (trapezoid)
    const a = proj(-LANE * 1.75, 0, FAR), b = proj(LANE * 1.75, 0, FAR), c = proj(LANE * 1.75, 0, -1), d = proj(-LANE * 1.75, 0, -1);
    g.fillStyle = "#4a3b6e"; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(c.x, c.y); g.lineTo(d.x, d.y); g.fill();
    // sleepers
    const off = st.dist % 2;
    for (let z = FAR; z > -1; z -= 2) {
      const zz = z - off;
      const l = proj(-LANE * 1.6, 0, zz), r = proj(LANE * 1.6, 0, zz);
      g.strokeStyle = "rgba(20,10,40,.55)"; g.lineWidth = Math.max(1, 10 * l.s); g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(r.x, r.y); g.stroke();
    }
    // rails
    for (const lx of [-1, 0, 1]) for (const side of [-0.55, 0.55]) {
      const p1 = proj(lx * LANE + side, 0, FAR), p2 = proj(lx * LANE + side, 0, -1);
      g.strokeStyle = "#c9c2e8"; g.lineWidth = 3; g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke();
    }
    // side buildings
    for (const side of [-1, 1]) {
      for (let z = FAR; z > -2; z -= 6) {
        const zz = z - (st.dist % 6);
        const n = Math.floor((st.dist + zz) / 6);
        const h = 6 + ((n * 7919 + (side > 0 ? 3 : 0)) % 6);
        const p = proj(side * LANE * 2.4, 0, zz), q = proj(side * LANE * 2.4, h, zz);
        const w = 4.5 * p.s * W * 0.16;
        const x = side < 0 ? p.x - w : p.x;
        g.fillStyle = ["#3b1d6e", "#24124a", "#4b2a8a"][((n % 3) + 3) % 3];
        g.fillRect(x, q.y, w, p.y - q.y);
        g.fillStyle = "rgba(255,210,122,.75)";
        const ww = w / 6;
        for (let r = 0; r < 5; r++) for (let k = 0; k < 2; k++) {
          if (((n + r * 3 + k) % 4) === 0) continue;
          g.fillRect(x + ww * (1 + k * 3), q.y + (p.y - q.y) * (0.12 + r * 0.17), ww, (p.y - q.y) * 0.08);
        }
      }
    }
  }

  function drawObstacle(o) {
    const x = o.lane * LANE;
    if (o.kind === "coin") {
      const p = proj(x, o.y + Math.sin(st.t * 6 + o.z) * 0.1, o.z);
      const r = 0.45 * p.s * W * 0.16;
      g.save(); g.translate(p.x, p.y); g.scale(Math.abs(Math.cos(st.t * 5 + o.z)) * 0.8 + 0.2, 1);
      g.fillStyle = "#ffd23f"; g.strokeStyle = "#fff"; g.lineWidth = Math.max(1, r * 0.2);
      g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = "#e0a400"; g.beginPath(); g.arc(0, 0, r * 0.5, 0, Math.PI * 2); g.fill();
      g.restore(); return;
    }
    if (o.kind === "train") {
      const zf = o.z, zb = o.z + o.len, w = 1.05, h = 3.2;
      const a = proj(x - w, 0, zb), b = proj(x + w, h, zb), c = proj(x - w, 0, zf), d = proj(x + w, h, zf);
      // roof / side (far face first)
      g.fillStyle = "#1f6f8f"; g.beginPath(); g.moveTo(a.x, b.y); g.lineTo(b.x, b.y); g.lineTo(d.x, d.y); g.lineTo(c.x, d.y); g.fill();
      g.fillStyle = "#2fa3c7"; g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x, a.y); g.lineTo(d.x, c.y); g.lineTo(d.x, d.y); g.fill();
      g.beginPath(); g.moveTo(a.x, b.y); g.lineTo(a.x, a.y); g.lineTo(c.x, c.y); g.lineTo(c.x, d.y); g.fill();
      // front face
      const fw = d.x - c.x, fh = c.y - d.y;
      g.fillStyle = "#38e1ff"; rr(c.x, d.y, fw, fh, fw * 0.08); g.fill();
      g.fillStyle = "#0d0820"; rr(c.x + fw * 0.12, d.y + fh * 0.12, fw * 0.76, fh * 0.32, fw * 0.05); g.fill();
      g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(c.x + fw * 0.22, d.y + fh * 0.75, fw * 0.08, 0, 7); g.arc(c.x + fw * 0.78, d.y + fh * 0.75, fw * 0.08, 0, 7); g.fill();
      g.fillStyle = "#ff4fa3"; g.fillRect(c.x, d.y + fh * 0.52, fw, fh * 0.07);
      return;
    }
    if (o.kind === "barrier") {   // low: jump over it
      const a = proj(x - 1.05, 0, o.z), b = proj(x + 1.05, 1.1, o.z);
      const w = b.x - a.x, h = a.y - b.y;
      g.fillStyle = "#fff"; g.fillRect(a.x + w * 0.08, b.y, w * 0.08, h); g.fillRect(a.x + w * 0.84, b.y, w * 0.08, h);
      for (let i = 0; i < 2; i++) {
        const y = b.y + h * (0.05 + i * 0.38);
        g.fillStyle = "#ff4d5e"; g.fillRect(a.x, y, w, h * 0.3);
        g.fillStyle = "#fff"; for (let k = 0; k < 4; k++) g.fillRect(a.x + w * (0.12 + k * 0.24), y, w * 0.1, h * 0.3);
      }
      return;
    }
    if (o.kind === "bar") {       // high: slide under it
      const a = proj(x - 1.15, 0, o.z), top = proj(x + 1.15, 2.9, o.z), low = proj(x, 1.55, o.z);
      const w = top.x - a.x;
      g.fillStyle = "#c9c2e8"; g.fillRect(a.x, top.y, w * 0.07, a.y - top.y); g.fillRect(a.x + w * 0.93, top.y, w * 0.07, a.y - top.y);
      g.fillStyle = "#ffd23f"; g.fillRect(a.x, top.y, w, low.y - top.y);
      g.fillStyle = "#0d0820"; for (let k = 0; k < 5; k++) g.fillRect(a.x + w * (0.05 + k * 0.2), top.y, w * 0.09, low.y - top.y);
      return;
    }
  }

  // original hero seen from behind: short dark hair, glasses temples, beard edge, white tee
  function drawPlayer() {
    const p = proj(st.px, st.y, 0.6);
    const u = p.s * W * 0.16;              // 1 world unit in px
    const sliding = st.slide > 0;
    const legA = Math.sin(st.run * 14) * (st.y > 0 || sliding ? 0.2 : 1);
    g.save(); g.translate(p.x, p.y);
    if (sliding) g.scale(1.1, 0.55);
    // shadow
    g.save(); g.scale(1, 0.3); g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.arc(0, (st.y * u) / 0.3, u * 0.7 / (1 + st.y * 0.3), 0, 7); g.fill(); g.restore();
    // legs
    g.fillStyle = "#2d2a4a";
    rr(-u * 0.32, -u * 1.0 + legA * u * 0.08, u * 0.26, u * 1.0, u * 0.12); g.fill();
    rr(u * 0.06, -u * 1.0 - legA * u * 0.08, u * 0.26, u * 1.0, u * 0.12); g.fill();
    g.fillStyle = "#ffffff";
    rr(-u * 0.36, -u * 0.12 + legA * u * 0.08, u * 0.32, u * 0.16, u * 0.06); g.fill();
    rr(u * 0.04, -u * 0.12 - legA * u * 0.08, u * 0.32, u * 0.16, u * 0.06); g.fill();
    // arms
    g.fillStyle = "#f0f0f5";
    g.save(); g.translate(-u * 0.48, -u * 1.75); g.rotate(-legA * 0.6); rr(-u * 0.11, 0, u * 0.22, u * 0.7, u * 0.11); g.fill(); g.fillStyle = "#e8b48c"; g.beginPath(); g.arc(0, u * 0.72, u * 0.11, 0, 7); g.fill(); g.restore();
    g.fillStyle = "#f0f0f5";
    g.save(); g.translate(u * 0.48, -u * 1.75); g.rotate(legA * 0.6); rr(-u * 0.11, 0, u * 0.22, u * 0.7, u * 0.11); g.fill(); g.fillStyle = "#e8b48c"; g.beginPath(); g.arc(0, u * 0.72, u * 0.11, 0, 7); g.fill(); g.restore();
    // torso (white tee) + backpack
    g.fillStyle = "#ffffff"; rr(-u * 0.5, -u * 1.95, u * 1.0, u * 1.05, u * 0.3); g.fill();
    g.fillStyle = "#3d8bff"; rr(-u * 0.32, -u * 1.85, u * 0.64, u * 0.7, u * 0.14); g.fill();
    g.fillStyle = "#ff4fa3"; rr(-u * 0.2, -u * 1.55, u * 0.4, u * 0.12, u * 0.05); g.fill();
    // head from behind
    g.fillStyle = "#e8b48c"; g.beginPath(); g.arc(0, -u * 2.35, u * 0.42, 0, 7); g.fill();
    g.fillStyle = "#3a2a20"; g.beginPath(); g.arc(0, -u * 2.42, u * 0.42, Math.PI * 1.05, Math.PI * 1.95); g.lineTo(u * 0.4, -u * 2.25); g.lineTo(-u * 0.4, -u * 2.25); g.fill();
    // beard edge + glasses temples
    g.fillStyle = "#4a3a30"; g.fillRect(-u * 0.44, -u * 2.25, u * 0.1, u * 0.2); g.fillRect(u * 0.34, -u * 2.25, u * 0.1, u * 0.2);
    g.strokeStyle = "#5a4636"; g.lineWidth = Math.max(1, u * 0.06);
    g.beginPath(); g.moveTo(-u * 0.42, -u * 2.33); g.lineTo(-u * 0.3, -u * 2.36); g.moveTo(u * 0.42, -u * 2.33); g.lineTo(u * 0.3, -u * 2.36); g.stroke();
    g.restore();
  }

  // front portrait for the title screen (original cartoon, not a photo)
  function drawHeroCard() {
    const hc = document.getElementById("hero"), h = hc.getContext("2d");
    h.clearRect(0, 0, 300, 300);
    h.fillStyle = "#ff4fa3"; h.beginPath(); h.arc(150, 150, 140, 0, 7); h.fill();
    h.fillStyle = "#ffffff"; h.beginPath(); h.ellipse(150, 300, 110, 80, 0, Math.PI, 0); h.fill();
    h.fillStyle = "#e8b48c"; h.beginPath(); h.ellipse(150, 140, 78, 90, 0, 0, 7); h.fill();
    h.fillStyle = "#4a3a30"; h.beginPath(); h.moveTo(74, 150); h.quadraticCurveTo(80, 240, 150, 240); h.quadraticCurveTo(220, 240, 226, 150);
    h.quadraticCurveTo(210, 200, 150, 205); h.quadraticCurveTo(90, 200, 74, 150); h.fill();
    h.fillStyle = "#3a2a20"; h.beginPath(); h.ellipse(150, 72, 80, 40, 0, Math.PI, 0); h.fill(); h.fillRect(72, 70, 156, 14);
    h.strokeStyle = "#3a2a20"; h.lineWidth = 7; h.fillStyle = "rgba(200,230,255,.35)";
    for (const x of [118, 182]) { h.beginPath(); h.roundRect(x - 30, 118, 60, 40, 10); h.fill(); h.stroke(); }
    h.beginPath(); h.moveTo(148, 136); h.lineTo(152, 136); h.stroke();
    h.fillStyle = "#1b1530"; h.beginPath(); h.arc(118, 140, 7, 0, 7); h.arc(182, 140, 7, 0, 7); h.fill();
    h.strokeStyle = "#1b1530"; h.lineWidth = 6; h.beginPath(); h.moveTo(128, 192); h.quadraticCurveTo(150, 208, 172, 192); h.stroke();
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.on) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    st.t += dt;
    st.speed = Math.min(42, 16 + st.t * 0.45);
    const dz = st.speed * dt;
    st.dist += dz; st.run += dt;
    st.px += (st.lane * LANE - st.px) * Math.min(1, dt * 14);
    st.vy -= 32 * dt; st.y = Math.max(0, st.y + st.vy * dt); if (st.y === 0) st.vy = 0;
    if (st.slide > 0) st.slide -= dt;
    st.shake = Math.max(0, st.shake - dt * 3); st.flash = Math.max(0, st.flash - dt * 3);

    for (const o of st.obs) o.z -= dz;
    st.spawnZ -= dz;
    while (st.spawnZ < FAR) { spawnRow(st.spawnZ + 4); st.spawnZ += Math.max(10, 18 - st.t * 0.12); }

    const myLane = Math.round(st.px / LANE);
    for (const o of st.obs) {
      if (o.hit) continue;
      const inZ = o.kind === "train" ? (o.z < 1.1 && o.z + o.len > 0.1) : (o.z < 1.0 && o.z > 0.2);
      if (!inZ || o.lane !== myLane) continue;
      if (o.kind === "coin") {
        if (Math.abs(st.y - 0.4) < 1.2) { o.hit = true; st.coins++; sfx.coin(); burst(o); }
        continue;
      }
      const ok = (o.kind === "barrier" && st.y > 1.05) || (o.kind === "bar" && st.slide > 0);
      if (!ok) return crash();
    }
    st.obs = st.obs.filter((o) => o.z + (o.len || 0) > -2 && !(o.kind === "coin" && o.hit));
    for (const p of st.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; }
    st.parts = st.parts.filter((p) => p.t < 0.6);

    document.getElementById("score").textContent = Math.floor(st.dist + st.coins * 10);
    document.getElementById("coins").textContent = st.coins;
  }

  function burst(o) {
    const p = proj(o.lane * LANE, o.y, o.z);
    for (let i = 0; i < 8; i++) st.parts.push({ x: p.x, y: p.y, vx: Math.cos(i) * 160, vy: -Math.abs(Math.sin(i)) * 260, t: 0 });
  }

  function crash() {
    st.on = false; st.shake = 1; st.flash = 1; sfx.crash();
    const score = Math.floor(st.dist + st.coins * 10);
    if (score > best) { best = score; store.set(best); }
    setTimeout(() => {
      document.getElementById("final").innerHTML = `النقاط: <b>${score}</b> — القطع: <b>${st.coins}</b><br/>أفضل نتيجة: <b>${best}</b>`;
      document.getElementById("over").classList.remove("hidden");
    }, 650);
  }

  function render() {
    g.save();
    if (st.shake > 0) g.translate((Math.random() - 0.5) * 18 * st.shake, (Math.random() - 0.5) * 18 * st.shake);
    drawScene();
    const list = st.obs.filter((o) => o.z > -1.5 && o.z < FAR).sort((a, b) => (b.z + (b.len || 0)) - (a.z + (a.len || 0)));
    const behind = list.filter((o) => o.z > 0.6), front = list.filter((o) => o.z <= 0.6);
    behind.forEach(drawObstacle);
    drawPlayer();
    front.forEach(drawObstacle);
    g.fillStyle = "#ffd23f"; for (const p of st.parts) { g.globalAlpha = 1 - p.t / 0.6; g.beginPath(); g.arc(p.x, p.y, 4, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    if (st.flash > 0) { g.fillStyle = `rgba(255,77,94,${st.flash * 0.45})`; g.fillRect(0, 0, W, H); }
    g.restore();
  }

  function start() {
    reset();
    document.getElementById("start").classList.add("hidden");
    document.getElementById("over").classList.add("hidden");
    document.getElementById("hud").style.display = "flex";
    beep(660, 0.1, "triangle", 0.06);
  }
  document.getElementById("play").onclick = start;
  document.getElementById("again").onclick = start;
  drawHeroCard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
