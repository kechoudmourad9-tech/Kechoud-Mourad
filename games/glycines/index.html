<style>
/* Twilight garden: wisteria-purple night UI around bright, sunlit illustrated scenes; coins in gold, leaves in green. One committed look. */
:root {
  --night: #1d1530; --night-2: #2a1f45; --night-3: #3a2c5e; --line: #5b4a86;
  --wisteria: #b49bff; --leaf: #5fd38a; --gold: #ffc94a; --gold-deep: #d9952a; --rose: #ff6f91; --sky: #8fd3ff;
  --paper: #fff8ec; --ink: #241a35; --mute: #b9addb;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 18px; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: #f5efff; font-family: var(--body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding-block: 10px 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.pill { display: flex; align-items: center; gap: 6px; background: var(--night-2); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 4px; font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pill .ico { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 17px; }
.pill.coins .ico { background: radial-gradient(circle at 35% 30%, #ffe9a6, var(--gold) 55%, var(--gold-deep)); }
.pill.stars .ico { background: radial-gradient(circle at 35% 30%, #fff, #ffe27a 50%, #e0a92b); }
.topbar .spacer { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--night-2); border: 2px solid var(--line); font-size: 18px; }
.bump { animation: bump .45s; }
@keyframes bump { 30% { transform: scale(1.25); } }

/* views */
main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 4px 110px; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
h2 { font-size: 24px; } h3 { font-size: 18px; }
.muted { color: var(--mute); }
.view { display: flex; flex-direction: column; gap: 14px; }

/* zone tabs + scene */
.zonetabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.zonetabs::-webkit-scrollbar { display: none; }
.ztab { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--night-2); border: 2px solid var(--line); font-weight: 800; font-size: 13px; white-space: nowrap; }
.ztab[aria-selected="true"] { background: var(--wisteria); color: var(--ink); border-color: var(--wisteria); }
.ztab.locked { opacity: .55; }
.scenecard { position: relative; border-radius: 22px; overflow: hidden; border: 3px solid var(--night-3); box-shadow: 0 14px 30px #0008; background: #87c9f0; }
.scenecard svg { display: block; width: 100%; height: auto; }
.zonehead { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.progress { height: 10px; border-radius: 999px; background: var(--night-2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), #b6f06a); border-radius: 999px; transition: width .6s; }
.mark { cursor: pointer; }
.mark circle { animation: pulse 1.6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.lockveil { position: absolute; inset: 0; display: grid; place-items: center; background: #1d1530cc; text-align: center; padding: 20px; backdrop-filter: blur(3px); }
.lockveil b { font-family: var(--display); font-size: 22px; }

/* renovation list */
.tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.task { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: var(--r); background: var(--night-2); border: 2px solid var(--line); text-align: left; min-width: 0; }
.task .ti { font-size: 28px; line-height: 1; }
.task .tn { font-weight: 800; line-height: 1.15; }
.task .tp { display: flex; align-items: center; gap: 5px; font-family: var(--display); font-weight: 800; color: var(--gold); }
.task.done { border-color: var(--leaf); background: linear-gradient(160deg, #24402f, var(--night-2)); }
.task.done .tp { color: var(--leaf); }
.task.cant .tp { color: #ff9aa9; }

/* big play button */
.playbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, var(--night) 35%); display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.playbtn { width: 100%; padding: 14px; border-radius: 20px; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--ink); background: linear-gradient(180deg, #ffe07a, var(--gold) 55%, var(--gold-deep)); box-shadow: 0 6px 0 #9a6214, 0 12px 24px #0007; display: flex; align-items: center; justify-content: center; gap: 10px; }
.playbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a6214; }
.playbtn small { font-family: var(--body); font-size: 13px; font-weight: 800; opacity: .75; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nav button { padding: 7px 4px; border-radius: 14px; background: var(--night-2); border: 2px solid var(--line); font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.nav button span { font-size: 19px; }
.nav button[aria-current="page"] { border-color: var(--wisteria); color: var(--wisteria); }
.dot { position: absolute; top: 4px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 2px var(--night-2); }

/* sheets / dialogs */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: #0b0716aa; animation: fade .2s; }
.sheet.center { align-items: center; }
@keyframes fade { from { opacity: 0; } }
.panel { width: min(560px, 100%); max-height: 88%; overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 26px 26px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .28s cubic-bezier(.2,.9,.3,1.2); }
.sheet.center .panel { border-radius: 26px; width: min(440px, calc(100% - 32px)); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.panel .muted { color: #6b5b88; }
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.style { border-radius: 16px; border: 3px solid #e4d8f5; background: #fff; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 12.5px; text-align: center; color: var(--ink); }
.style svg { width: 100%; height: auto; border-radius: 10px; background: #eaf6ff; }
.style[aria-pressed="true"] { border-color: var(--leaf); box-shadow: 0 0 0 3px #5fd38a55; }
.btn { padding: 13px 16px; border-radius: 16px; font-family: var(--display); font-weight: 800; font-size: 19px; background: var(--leaf); color: #0f2a19; box-shadow: 0 5px 0 #2e8a52; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e8a52; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 #9a6214; }
.btn.ghost { background: #efe6fb; color: var(--ink); box-shadow: 0 5px 0 #cdbfe6; }
.btn.red { background: var(--rose); color: #fff; box-shadow: 0 5px 0 #b83a5c; }
.btn[disabled] { filter: grayscale(.8); opacity: .6; }
.row { display: flex; gap: 10px; } .row > * { flex: 1; }
.speaker { display: flex; gap: 12px; align-items: flex-start; }
.speaker svg { flex: none; width: 74px; height: 74px; }
.bubble { background: #fff; border: 2px solid #e4d8f5; border-radius: 18px; padding: 12px 14px; font-weight: 700; line-height: 1.4; }
.bubble b { color: #7a4fd6; }

/* lists: shop, achievements, album */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--night-2); border: 2px solid var(--line); }
.card .big { font-size: 30px; width: 44px; text-align: center; flex: none; }
.card .grow { flex: 1; min-width: 0; }
.card .grow b { display: block; font-size: 15.5px; }
.card .grow span { font-size: 13px; color: var(--mute); }
.buy { padding: 8px 12px; border-radius: 12px; background: var(--gold); color: var(--ink); font-family: var(--display); font-weight: 800; white-space: nowrap; box-shadow: 0 3px 0 #9a6214; }
.buy[disabled] { filter: grayscale(1); opacity: .5; }
.bar2 { height: 8px; border-radius: 99px; background: var(--night); margin-top: 6px; overflow: hidden; } .bar2 i { display: block; height: 100%; background: var(--wisteria); }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.album div { aspect-ratio: 1; border-radius: 14px; background: var(--night-2); border: 2px solid var(--line); display: grid; place-items: center; font-size: 28px; position: relative; }
.album div.no span { filter: brightness(0) invert(1) opacity(.2); }
.album div small { position: absolute; bottom: 2px; right: 6px; font-size: 11px; font-weight: 900; color: var(--gold); font-family: var(--body); filter: none; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days div { border-radius: 12px; background: var(--night-2); border: 2px solid var(--line); text-align: center; padding: 6px 2px; font-size: 11px; font-weight: 800; }
.days div b { display: block; font-size: 20px; }
.days div.got { border-color: var(--leaf); opacity: .6; } .days div.today { border-color: var(--gold); background: #4a3a1c; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--night-2); border: 2px solid var(--line); font-weight: 800; }
.switch { width: 52px; height: 30px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
.switch[aria-checked="true"] { background: var(--leaf); } .switch[aria-checked="true"]::after { left: 25px; }

/* hidden-object game */
#game { position: fixed; inset: 0; z-index: 20; background: #120c20; display: flex; flex-direction: column; }
.ghead { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); background: var(--night); }
.timer { flex: 1; height: 26px; border-radius: 99px; background: var(--night-2); border: 2px solid var(--line); position: relative; overflow: hidden; }
.timer i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--leaf), #c6f06a); transition: width .25s linear; }
.timer.low i { background: linear-gradient(90deg, var(--rose), #ffa36f); }
.timer span { position: relative; display: block; text-align: center; font-family: var(--display); font-weight: 800; line-height: 22px; font-variant-numeric: tabular-nums; }
.lvl { font-family: var(--display); font-weight: 800; font-size: 17px; white-space: nowrap; }
.viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: crosshair; background: #000; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.obj { position: absolute; transform: translate(-50%, -50%); line-height: 1; pointer-events: none; }
.obj.gone { animation: gone .5s forwards; }
@keyframes gone { 40% { transform: translate(-50%, -50%) scale(1.6); filter: drop-shadow(0 0 12px #fff); } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
.fx { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
.ring { border: 5px solid var(--gold); border-radius: 50%; animation: ring .6s forwards; }
@keyframes ring { from { width: 10px; height: 10px; opacity: 1; } to { width: 130px; height: 130px; opacity: 0; } }
.miss { color: var(--rose); font-size: 52px; font-weight: 900; font-family: var(--display); animation: miss .6s forwards; }
@keyframes miss { 0% { transform: translate(-50%, -50%) scale(.4); } 30% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }
.hintring { width: 120px; height: 120px; border: 6px solid var(--gold); border-radius: 50%; box-shadow: 0 0 0 9999px #00000055, 0 0 30px var(--gold); animation: hint 1s infinite; }
@keyframes hint { 50% { transform: translate(-50%, -50%) scale(.8); } }
.night { position: absolute; inset: 0; pointer-events: none; }
.combo { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--gold); text-shadow: 0 3px 0 #7a4a00, 0 0 18px #000; pointer-events: none; animation: pop .7s forwards; white-space: nowrap; }
@keyframes pop { 0% { transform: translate(-50%, 10px) scale(.6); opacity: 0; } 25% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -20px); opacity: 0; } }
.zoomctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 40px; height: 40px; border-radius: 12px; background: #1d1530cc; border: 2px solid var(--line); font-size: 22px; font-weight: 900; }
.gfoot { background: var(--night); padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip { border-radius: 12px; background: var(--paper); color: var(--ink); padding: 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50px; text-align: center; font-weight: 800; font-size: 11.5px; line-height: 1.1; position: relative; min-width: 0; }
.chip .e { font-size: 24px; line-height: 1; }
.chip .e.sil { filter: brightness(0); }
.chip.done { background: #2b4d36; color: #bff0cf; }
.chip.done::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; color: var(--leaf); background: #1d3a27cc; border-radius: 12px; }
.boosters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.boost { padding: 8px; border-radius: 14px; background: var(--night-2); border: 2px solid var(--line); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; }
.boost span { font-size: 20px; } .boost b { position: absolute; top: -8px; right: -6px; background: var(--rose); color: #fff; border-radius: 99px; padding: 0 7px; font-size: 12px; }
.boost[disabled] { opacity: .45; }
.modebadge { font-size: 12px; font-weight: 900; padding: 3px 9px; border-radius: 99px; background: var(--wisteria); color: var(--ink); white-space: nowrap; }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 14px; font-weight: 800; z-index: 50; box-shadow: 0 10px 30px #0008; animation: toast 2.6s forwards; max-width: calc(100% - 32px); text-align: center; }
@keyframes toast { 0% { transform: translate(-50%, -20px); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { opacity: 0; } }
.confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.result-stars { display: flex; justify-content: center; gap: 6px; font-size: 54px; }
.result-stars span { filter: grayscale(1) opacity(.3); transform: scale(.6); transition: all .4s cubic-bezier(.2,1.6,.4,1); }
.result-stars span.on { filter: none; transform: scale(1); }
.lines { display: flex; flex-direction: column; gap: 6px; font-weight: 800; }
.lines div { display: flex; justify-content: space-between; } .lines div:last-child { border-top: 2px dashed #e4d8f5; padding-top: 6px; font-size: 18px; color: #7a4fd6; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

const PRICE = { hint: 60, time: 50, bolt: 110 };
const BOOST = { hint: ["🔍", "Loupe"], time: ["⏳", "+30 s"], bolt: ["⚡", "Éclair"] };

/* builds one scene: targets + clutter, placed so every target stays mostly visible */
const buildScene = (cfg, attempt) => {
  const r = rng(cfg.L * 7919 + attempt * 104729 + 17), sc = SCENES[cfg.theme.id]();
  const pool = [...new Set(cfg.theme.pools.flatMap((p) => POOL[p]))];
  const order = shuffle(pool, r), targets = order.slice(0, cfg.targets), clutterPool = order.slice(cfg.targets);
  const placed = [], inOcc = (x, y) => sc.occ.some(([ox, oy, w, h]) => x > ox + 12 && x < ox + w - 12 && y > oy + 12 && y < oy + h - 12);
  const place = (e, size, isT) => {
    for (let k = 0; k < 400; k++) {
      const x = 40 + r() * (SW - 80), y = 40 + r() * (SH - 80);
      if (isT && inOcc(x, y)) continue;
      const ok = placed.every((p) => { const d = Math.hypot(p.x - x, p.y - y), rr = (p.size + size) / 2; return isT || p.t ? d > rr * (isT && p.t ? 1.05 : 0.62) : d > rr * 0.42; });
      if (ok) { const o = { e, x, y, size, rot: (r() - 0.5) * (isT ? 50 : 80), t: isT, op: isT ? 1 : 0.85 + r() * 0.15, flip: r() < 0.3 }; placed.push(o); return o; }
    }
    return null;
  };
  const tl = targets.map((e) => place(e, cfg.tmin + r() * (cfg.tmax - cfg.tmin), true)).filter(Boolean);
  for (let i = 0; i < cfg.clutter; i++) place(clutterPool[i % clutterPool.length], 40 + r() * 52, false);
  return { sc, objs: shuffle(placed, r), targets: tl };
};

let G = null;

  const z = ZONE_BY[ZONE], open = zoneOpen(z), done = zoneCount(z), it = S.items[z.id] || {};
  const marks = open ? z.items.filter((x) => it[x.id] === undefined).map((x) => `<g class="mark" data-item="${x.id}" transform="translate(${x.a[0]} ${x.a[1]})"><circle r="30" fill="#ffc94a" stroke="#fff" stroke-width="5"/><text y="11" text-anchor="middle" font-size="30">🔨</text></g>`).join("") : "";
  const scene = zoneSVG(z, S).replace("</svg>", marks + "</svg>");
  $("#main").innerHTML = `<section class="view">
    <div class="zonetabs" role="tablist">${ZONES.map((q) => `<button class="ztab ${zoneOpen(q) ? "" : "locked"}" role="tab" aria-selected="${q.id === ZONE}" data-z="${q.id}">${q.icon} ${TAB[q.id]} ${zoneOpen(q) ? `<span class="muted">${zoneCount(q)}/8</span>` : `🔒 ${q.need}⭐`}</button>`).join("")}</div>
    <div class="zonehead"><div><h2>${z.name}</h2><span class="muted">${open ? `${done} rénovation${done > 1 ? "s" : ""} sur 8` : `Débloquée avec ${z.need} étoiles`}</span></div><span class="muted">${Math.round((done / 8) * 100)} %</span></div>
    <div class="progress"><i style="width:${(done / 8) * 100}%"></i></div>
    <div class="scenecard" id="zoneScene">${scene}${open ? "" : `<div class="lockveil"><div><b>🔒 ${z.name}</b><p>Il te faut <b>${z.need} ⭐</b> pour ouvrir cette partie. Tu en as ${S.stars}.<br>Chaque niveau rapporte jusqu'à 3 étoiles.</p></div></div>`}</div>
    ${open ? `<h3>Rénovations</h3><div class="tasks">${z.items.map((x) => { const v = it[x.id], p = priceOf(z, x); return `<button class="task ${v !== undefined ? "done" : S.coins < p ? "cant" : ""}" data-item="${x.id}"><span class="ti">${x.i}</span><span class="tn">${x.n}</span><span class="tp">${v !== undefined ? `✓ ${x.s[v]}` : `🪙 ${fmt(p)}`}</span></button>`; }).join("")}</div>` : ""}
  </section>`;
  document.querySelectorAll(".ztab").forEach((b) => (b.onclick = () => { sfx("click"); ZONE = b.dataset.z; viewDomaine(); }));
  document.querySelectorAll("[data-item]").forEach((b) => (b.onclick = () => { sfx("click"); openItem(z, z.items.find((x) => x.id === b.dataset.item)); }));
};

const openItem = (z, x) => {
  const it = S.items[z.id] || {}, owned = it[x.id] !== undefined, p = priceOf(z, x);
  let sel = owned ? it[x.id] : 0;
  const [bx, by, bw, bh] = x.box, pad = 20, vb = `${bx - pad} ${by - pad} ${bw + pad * 2} ${bh + pad * 2}`;
  const s = sheet(`<div class="speaker">${ODETTE}<div class="bubble"><b>${x.i} ${x.n}</b><br>${owned ? "Tu peux changer de style gratuitement." : "Choisis un style, je m'occupe du reste !"}</div></div>
    <div class="styles">${x.s.map((n, v) => `<button class="style" data-v="${v}" aria-pressed="${v === sel}">${zoneSVG(z, S, { id: x.id, v }, vb)}<span>${n}</span></button>`).join("")}</div>
    <div id="itBtn"></div><button class="btn ghost" id="itClose">Fermer</button>`);
  const paint = () => { s.querySelectorAll(".style").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.v === sel)); const can = S.coins >= p;
    $("#itBtn", s).innerHTML = owned ? `<button class="btn" id="itGo" ${it[x.id] === sel ? "disabled" : ""}>Appliquer ce style</button>` : can ? `<button class="btn gold" id="itGo">Rénover · 🪙 ${fmt(p)}</button>` : `<button class="btn gold" disabled>Il te manque 🪙 ${fmt(p - S.coins)}</button><p class="muted" style="text-align:center;margin:6px 0 0">Joue un niveau pour gagner des pièces.</p>`;
    const go = $("#itGo", s); if (go) go.onclick = buy; };
  const buy = () => {
    if (!owned) { if (S.coins < p) return; S.coins -= p; S.stats.renov++; }
    S.items[z.id] = { ...(S.items[z.id] || {}), [x.id]: sel }; save(); closeSheet(); sfx(owned ? "click" : "buy"); if (!owned) confetti(40);
    renderAll(); const svgEl = $("#zoneScene svg"); if (svgEl) { svgEl.style.transition = "filter .6s"; svgEl.style.filter = "brightness(1.35)"; setTimeout(() => (svgEl.style.filter = ""), 250); }
    if (!owned) toast(`${x.n} : ${x.s[sel].toLowerCase()} !`);
    if (zoneCount(z) === 8) setTimeout(() => story(`done_${z.id}`, z.id === "piscine" ? "Oh… regarde ce domaine ! Les Glycines n'ont jamais été aussi belles. Merci, mon petit. Continue à jouer : il reste toujours des objets cachés et des succès à décrocher !" : `${z.name} est entièrement rénové${z.name.startsWith("La") ? "e" : ""} ! Je n'en reviens pas. Gagne des étoiles pour ouvrir la suite de la maison.`), 600);
  };
  s.querySelectorAll(".style").forEach((b) => (b.onclick = () => { sel = +b.dataset.v; sfx("click"); paint(); }));
  $("#itClose", s).onclick = closeSheet; paint();
};

const checkUnlocks = () => {
  ZONES.forEach((z, i) => { if (i && zoneOpen(z) && !S.story[`open_${z.id}`]) { S.story[`open_${z.id}`] = 1; save(); setTimeout(() => say(`Tu as gagné assez d'étoiles : <b>${z.name.toLowerCase()}</b> est ouvert${z.name.startsWith("La") ? "e" : ""} aux travaux ! Va voir dans le Domaine.`, "Allons-y !", () => { ZONE = z.id; VIEW = "domaine"; renderAll(); }), 400); } });
};

const SHOP = [["hint", 1, 60], ["hint", 5, 250], ["time", 1, 50], ["time", 5, 210], ["bolt", 1, 110], ["bolt", 3, 300]];
const viewShop = () => {
  $("#main").innerHTML = `<section class="view"><h2>Boutique</h2><p class="muted" style="margin:0">Les bonus t'aident pendant la recherche. Tu as ${S.boosters.hint} 🔍 · ${S.boosters.time} ⏳ · ${S.boosters.bolt} ⚡.</p>
    <div class="cards">${SHOP.map(([k, n, p], i) => `<div class="card"><div class="big">${BOOST[k][0]}</div><div class="grow"><b>${n} × ${BOOST[k][1]}</b><span>${{ hint: "Montre un objet et zoome dessus", time: "Ajoute 30 secondes au chrono", bolt: "Trouve 2 objets d'un coup" }[k]}</span></div><button class="buy" data-i="${i}" ${S.coins < p ? "disabled" : ""}>🪙 ${fmt(p)}</button></div>`).join("")}</div>
    <h3>Cadeau du jour</h3>${dailyGrid()}<button class="btn gold" id="shopDaily" ${S.daily.last === today() ? "disabled" : ""}>${S.daily.last === today() ? "Reviens demain !" : "Ouvrir le cadeau du jour"}</button></section>`;
  document.querySelectorAll(".buy").forEach((b) => (b.onclick = () => { const [k, n, p] = SHOP[+b.dataset.i]; if (S.coins < p) return; S.coins -= p; S.boosters[k] += n; save(); sfx("coin"); toast(`+${n} ${BOOST[k][1]}`); renderAll(); }));
  $("#shopDaily").onclick = openDaily;
};
const DAILY = [["🪙", "60", (s) => (s.coins += 60)], ["🔍", "1", (s) => s.boosters.hint++], ["🪙", "100", (s) => (s.coins += 100)], ["⏳", "2", (s) => (s.boosters.time += 2)], ["🪙", "150", (s) => (s.coins += 150)], ["⚡", "1", (s) => s.boosters.bolt++], ["💰", "300", (s) => { s.coins += 300; s.boosters.hint += 2; }]];
const nextStreak = () => (S.daily.last && dayDiff(S.daily.last, today()) === 1 ? S.daily.streak + 1 : 1);
const dailyGrid = () => { const claimed = S.daily.last === today(), cur = claimed ? S.daily.streak : nextStreak(), idx = (cur - 1) % 7; return `<div class="days">${DAILY.map(([ic, n], i) => `<div class="${i < idx || (claimed && i === idx) ? "got" : i === idx ? "today" : ""}">J${i + 1}<b>${ic}</b>${n}</div>`).join("")}</div>`; };
const openDaily = () => {
  const claimed = S.daily.last === today();
  const s = sheet(`<h2>🎁 Cadeau du jour</h2><p class="muted">Reviens chaque jour : les cadeaux grossissent jusqu'au 7e jour.</p>${dailyGrid()}<button class="btn gold" id="dGo" ${claimed ? "disabled" : ""}>${claimed ? "Déjà récupéré aujourd'hui" : "Récupérer"}</button><button class="btn ghost" id="dNo">Fermer</button>`, { center: true });
  $("#dNo", s).onclick = closeSheet;
  $("#dGo", s).onclick = () => { const st = nextStreak(), [ic, n, f] = DAILY[(st - 1) % 7]; f(S); S.daily = { last: today(), streak: st }; save(); sfx("buy"); confetti(30); closeSheet(); toast(`Cadeau récupéré : ${ic} ${n}`); renderAll(); };
};

const viewAlbum = () => {
  const n = Object.keys(S.found).length;
  $("#main").innerHTML = `<section class="view"><h2>Album des trouvailles</h2><p class="muted" style="margin:0">${n} objets découverts sur ${ALL_OBJ.length}. Touche un objet pour voir son nom.</p><div class="progress"><i style="width:${(n / ALL_OBJ.length) * 100}%"></i></div>
    <div class="album">${ALL_OBJ.map((e) => `<div class="${S.found[e] ? "" : "no"}" data-e="${e}" role="img" aria-label="${S.found[e] ? CATALOG[e] : "Pas encore trouvé"}"><span>${e}</span>${S.found[e] ? `<small>${S.found[e]}</small>` : ""}</div>`).join("")}</div></section>`;
  document.querySelectorAll(".album div").forEach((d) => (d.onclick = () => toast(S.found[d.dataset.e] ? `${d.dataset.e} ${CATALOG[d.dataset.e]} · trouvé ${S.found[d.dataset.e]} fois` : "Pas encore trouvé : cherche bien !")));
};
const viewAch = () => {
  $("#main").innerHTML = `<section class="view"><h2>Succès</h2><div class="cards">${ACH.map(([id, n, d, f, goal, rew]) => { const v = Math.min(goal, f(S)), ok = v >= goal; return `<div class="card"><div class="big">${S.ach[id] ? "🏆" : ok ? "🎉" : "🔒"}</div><div class="grow"><b>${n}</b><span>${d} · ${fmt(v)}/${fmt(goal)}</span><div class="bar2"><i style="width:${(v / goal) * 100}%"></i></div></div>${S.ach[id] ? `<span class="muted">Fait</span>` : `<button class="buy" data-id="${id}" ${ok ? "" : "disabled"}>+${rew} 🪙</button>`}</div>`; }).join("")}</div></section>`;
  document.querySelectorAll(".buy[data-id]").forEach((b) => (b.onclick = () => { const a = ACH.find((x) => x[0] === b.dataset.id); if (!a || S.ach[a[0]] || a[3](S) < a[4]) return; S.ach[a[0]] = 1; S.coins += a[5]; save(); sfx("buy"); confetti(30); toast(`Succès « ${a[1]} » : +${a[5]} pièces`); renderAll(); }));
};

const openSettings = () => {
  const row = (k, n) => `<div class="toggle" style="background:#efe6fb;border-color:#e4d8f5;color:var(--ink)">${n}<button class="switch" role="switch" aria-checked="${S.settings[k]}" data-k="${k}" aria-label="${n}"></button></div>`;
  const s = sheet(`<h2>Réglages</h2>${row("sound", "Effets sonores")}${row("music", "Musique douce")}${row("vib", "Vibrations")}
    <p class="muted" style="margin:0">${cloud ? "Ta partie est sauvegardée sur ton compte Claude et sur cet appareil." : "Ta partie est sauvegardée sur cet appareil."}</p>
    <button class="btn ghost" id="sHelp">Comment jouer</button><button class="btn red" id="sReset">Recommencer depuis le début</button><button class="btn" id="sOk">Fermer</button>`, { center: true });
  s.querySelectorAll(".switch").forEach((b) => (b.onclick = () => { const k = b.dataset.k; S.settings[k] = !S.settings[k]; b.setAttribute("aria-checked", S.settings[k]); if (k === "music") setMusic(S.settings.music); save(); sfx("click"); }));
  $("#sOk", s).onclick = closeSheet;
  $("#sHelp", s).onclick = () => say("Joue un niveau : retrouve les objets de la liste avant la fin du chrono. Tu gagnes des <b>pièces</b> pour rénover et des <b>étoiles</b> pour ouvrir la façade, le salon, la cuisine, la chambre puis la piscine. Les modes <b>Mots</b>, <b>Ombres</b> et <b>Nuit</b> corsent la recherche !", "Compris");
  $("#sReset", s).onclick = () => { const c = sheet(`<h2>Tout effacer ?</h2><p class="muted">Tes pièces, étoiles, rénovations et succès seront perdus. Cette action est définitive.</p><div class="row"><button class="btn ghost" id="rNo">Annuler</button><button class="btn red" id="rYes">Effacer</button></div>`, { center: true }); $("#rNo", c).onclick = closeSheet; $("#rYes", c).onclick = () => { S = DEF(); save(); closeSheet(); VIEW = "domaine"; ZONE = "jardin"; renderAll(); boot2(); }; };
};

/* ================= boot ================= */
const boot2 = () => {
  if (!S.story.intro) story("intro", "Bienvenue aux <b>Glycines</b>, mon petit ! Je te confie ma vieille maison… elle est en ruine, et tout est sens dessus dessous. Retrouve les objets perdus dans chaque pièce, gagne des <b>pièces</b>, et rénovons ensemble le jardin, la maison et même la piscine !", () => { if (S.daily.last !== today()) openDaily(); });
  else if (S.daily.last !== today()) openDaily();
};
const start = (data) => {
  const fromHot = data && data.S ? data.S : null, local = loadLocal();
  S = merge(DEF(), fromHot || local || {});
  $("#playBtn").onclick = () => { sfx("click"); startLevel(0); };
  document.querySelectorAll(".nav button").forEach((b) => (b.onclick = () => { sfx("click"); VIEW = b.dataset.view; renderAll(); $("#main").scrollTop = 0; }));
  $("#setBtn").onclick = openSettings; $("#dailyBtn").onclick = openDaily;
  document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.over) { G.pause(); if (!$("#layer").children.length) $("#gPause").click(); } });
  document.addEventListener("pointerdown", () => { audio(); if (S.settings.music && !musicOn) setMusic(true); }, { once: true });
  renderAll(); boot2(); initCloud();
  try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* no viewer hook */ }
  window.__glycines = { get S() { return S; }, get G() { return G; }, startLevel, levelCfg };
};
try { const h = window.claude && window.claude.hot; if (h && typeof h.ready === "function") h.ready(start); else start((h && h.data) || {}); } catch (e) { start({}); }
</script>
